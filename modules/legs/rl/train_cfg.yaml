# PPO on the v3 humanoid. Sizes are the plan; REPORT.md records what actually ran.
# Push range in walk_b/carry extends past the brief's 50-150 N so a 300 N x 0.2 s
# impulse (the 60 N·s lateral gate) is inside the training distribution.
# Preallocate of one 4-6 GiB block failed on this 8 GB card (see REPORT). Allocate as needed.
# Throughput on this RTX 5060, 1024 envs, implicitfast, iterations 4: about 2350
# env-steps/s once the step is compiled. 2048 envs did not go faster (GPU already full
# at about 2.3 GB). 108M steps is about 13 h. Euler was not faster than implicitfast.
mem_fraction: 0.85
episode_length: 1000
unroll_length: 20
num_minibatches: 32
num_updates_per_batch: 4
discounting: 0.97
learning_rate: 0.0003
entropy_cost: 0.005
clipping_epsilon: 0.2
reward_scaling: 1.0
max_grad_norm: 1.0
num_envs: 1024
batch_size: 32
seed: 0
hidden: [512, 256, 128]
num_evals: 6
num_eval_envs: 32

stages:
  walk_a:
    timesteps: 40000000
    vx: [0.4, 1.05]
    vy: [-0.25, 0.25]
    yaw: [-0.5, 0.5]
    stand_prob: 0.08
    gait_init_prob: 0.85
    push: false
    push_force: [50.0, 150.0]
    push_gate_prob: 0.0
    ref_weight: 1.0
    carry: [0.001, 0.001]
    rough: false
    restore: null
  walk_b:
    timesteps: 36000000
    vx: [0.0, 1.3]
    vy: [-0.3, 0.3]
    yaw: [-0.6, 0.6]
    stand_prob: 0.12
    gait_init_prob: 0.75
    push: true
    push_force: [50.0, 300.0]
    push_gate_prob: 0.15
    ref_weight: 0.2
    carry: [0.001, 0.001]
    rough: false
    restore: walk_a
  carry:
    timesteps: 32000000
    vx: [0.3, 1.2]
    vy: [-0.25, 0.25]
    yaw: [-0.5, 0.5]
    stand_prob: 0.1
    gait_init_prob: 0.8
    push: true
    push_force: [50.0, 300.0]
    push_gate_prob: 0.1
    ref_weight: 0.2
    carry: [0.0, 20.0]
    rough: true
    restore: walk_b
