# PPO on the v3 humanoid. Sizes are the plan; REPORT.md records what actually ran.
# A first walk_b attempt used 50-300 N plus a 15% chance of a 300 N x 0.2 s impulse.
# The eval fall rate stayed at 72% from 7.2M through 21.6M steps, so that run was
# stopped and walk_b was restarted from walk_a on the brief's 50-150 N range.
# Preallocate of one 4-6 GiB block failed on this 8 GB card (see REPORT). Allocate as needed.
# Throughput on this RTX 5060, 1024 envs, implicitfast, iterations 4: about 2350
# env-steps/s once the step is compiled. 2048 envs did not go faster (GPU already full
# at about 2.3 GB). 108M steps is about 13 h. Euler was not faster than implicitfast.
mem_fraction: 0.85
episode_length: 1000
unroll_length: 20
num_minibatches: 32
num_updates_per_batch: 4
discounting: 0.97
learning_rate: 0.0003
entropy_cost: 0.005
clipping_epsilon: 0.2
reward_scaling: 1.0
max_grad_norm: 1.0
num_envs: 1024
batch_size: 32
seed: 0
hidden: [512, 256, 128]
num_evals: 6
num_eval_envs: 32

stages:
  walk_a:
    timesteps: 40000000
    vx: [0.4, 1.05]
    vy: [-0.25, 0.25]
    yaw: [-0.5, 0.5]
    stand_prob: 0.08
    gait_init_prob: 0.85
    push: false
    push_force: [50.0, 150.0]
    push_gate_prob: 0.0
    ref_weight: 1.0
    carry: [0.001, 0.001]
    rough: false
    restore: null
  walk_b:
    timesteps: 30000000
    vx: [0.0, 1.3]
    vy: [-0.3, 0.3]
    yaw: [-0.6, 0.6]
    stand_prob: 0.12
    gait_init_prob: 0.75
    push: true
    push_force: [50.0, 150.0]
    push_gate_prob: 0.0
    ref_weight: 0.2
    carry: [0.001, 0.001]
    rough: false
    restore: walk_a
  carry:
    timesteps: 32000000
    vx: [0.3, 1.2]
    vy: [-0.25, 0.25]
    yaw: [-0.5, 0.5]
    stand_prob: 0.1
    gait_init_prob: 0.8
    push: true
    push_force: [50.0, 150.0]
    push_gate_prob: 0.0
    ref_weight: 0.2
    carry: [0.0, 20.0]
    rough: true
    restore: walk_b

  # ---- Job 10 (modules/controls/rl/RETRAIN_PLAN_J10.md). From scratch: obs is 109 (heading
  # error), leg residual 0.40 rad, so job-4 checkpoints cannot be restored.
  j10_walk:
    timesteps: 50000000
    vx: [0.3, 1.35]
    vy: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
    stand_prob: 0.10
    gait_init_prob: 0.80
    push: true
    push_force: [50.0, 150.0]
    push_gate_prob: 0.0
    ref_weight: 0.6
    carry: [0.001, 0.001]
    rough: false
    restore: null
    heading_obs: true
    tracking_sigma: 0.10
    heading_sigma: 0.10
    leg_action_mult: 1.6
    rewards: {tracking_lin: 2.0, tracking_ang: 1.0, heading: 1.0, knee_thermal: 0.5, knee_peak: 2.0}
  j10_push:
    timesteps: 30000000
    vx: [0.0, 1.35]
    vy: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
    stand_prob: 0.25
    gait_init_prob: 0.75
    push: true
    push_force: [50.0, 350.0]
    push_gate_prob: 0.30
    ref_weight: 0.3
    carry: [0.001, 0.001]
    rough: false
    restore: j10_walk
    heading_obs: true
    tracking_sigma: 0.10
    heading_sigma: 0.10
    leg_action_mult: 1.6
    rewards: {tracking_lin: 2.0, tracking_ang: 1.0, heading: 1.0, knee_thermal: 0.5, knee_peak: 2.0}
  j10_carry:
    timesteps: 30000000
    vx: [0.3, 1.3]
    vy: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
    stand_prob: 0.15
    gait_init_prob: 0.80
    push: true
    push_force: [50.0, 300.0]
    push_gate_prob: 0.15
    ref_weight: 0.3
    carry: [0.0, 22.0]
    rough: false
    restore: j10_push
    payload_pos: [[0.24, -0.02, 0.09], [0.33, 0.02, 0.425]]   # R-117: covers Legs (0.25,0,0.10) and P-042 (0.32,0,0.415)
    heading_obs: true
    tracking_sigma: 0.10
    heading_sigma: 0.10
    leg_action_mult: 1.6
    rewards: {tracking_lin: 2.0, tracking_ang: 1.0, heading: 1.0, knee_thermal: 0.5, knee_peak: 2.0}
  j10_rough:
    timesteps: 10000000
    vx: [0.3, 1.3]
    vy: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
    stand_prob: 0.15
    gait_init_prob: 0.80
    push: true
    push_force: [50.0, 300.0]
    push_gate_prob: 0.15
    ref_weight: 0.3
    carry: [0.0, 22.0]
    rough: true
    payload_pos: [[0.24, -0.02, 0.09], [0.33, 0.02, 0.425]]
    restore: j10_carry
    heading_obs: true
    tracking_sigma: 0.10
    heading_sigma: 0.10
    leg_action_mult: 1.6
    rewards: {tracking_lin: 2.0, tracking_ang: 1.0, heading: 1.0, knee_thermal: 0.5, knee_peak: 2.0}
